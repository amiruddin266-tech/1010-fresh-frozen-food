<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>1010 Admin Orders</title><style>body{font-family:system-ui;margin:0;background:#f5f5f0;color:#182018}.wrap{max-width:1200px;margin:40px auto;padding:0 20px}.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:20px;margin:12px 0;overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #eee;white-space:nowrap}.paid{color:#137333;font-weight:800}.pending{color:#a15c00;font-weight:800}</style></head><body><main class="wrap"><h1>1010 Fresh Frozen Food — Orders</h1><div class="card"><table><thead><tr><th>Order</th><th>Date</th><th>Customer</th><th>Phone</th><th>Total</th><th>Payment</th></tr></thead><tbody id="rows"></tbody></table></div></main><script>fetch('/admin/orders').then(r=>r.json()).then(d=>document.querySelector('#rows').innerHTML=d.orders.map(o=>`<tr><td>${o.order_no}</td><td>${new Date(o.created_at).toLocaleString()}</td><td>${o.customer_name}</td><td>${o.phone}</td><td>RM ${(o.total_cents/100).toFixed(2)}</td><td class="${o.payment_status}">${o.payment_status}</td></tr>`).join(''))</script></body></html>
